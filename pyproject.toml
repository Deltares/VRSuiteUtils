[project]
name = "preprocessing"
version = "1.2.1"
description = ""
authors = [{name = "Wouter Jan Klerk", email = "wouterjan.klerk@deltares.nl"}]
maintainers = [{name = "Stephan Rikkert", email="stephan.rikkert@deltares.nl"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["geopandas", "numpy", "seaborn", "pandas", "shapely", "fiona", "scipy", "geojson", "openpyxl", "owslib", "contextily", "matplotlib", "tqdm", "vr-dash @ git+https://github.com/Deltares-research/VrtoolDashboard.git@v1.2.0?rev_type=tag", "vrtool @ https://github.com/Deltares/Veiligheidsrendement/releases/download/v1.2.0/vrtool-1.2.0-py3-none-any.whl"]

[project.urls]
homepage = "https://deltares-research.github.io/VrtoolDocumentation/"
documentation = "https://deltares-research.github.io/VrtoolDocumentation/"
repository = "https://github.com/Deltares/VrToolPreprocess"
issues = "https://github.com/Deltares/veiligheidsrendement/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pixi.pypi-dependencies]
build = "*"
preprocessing = { path=".", editable=true }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.dependencies]
python = ">=3.12, <3.14"
geopandas = ">=1.0.1"
numpy = ">=1.24.3"
seaborn = ">=0.12.2"
pandas = ">=1.5.3"
shapely = ">=2.0.1"
fiona = ">=1.9.3"
scipy = ">=1.8.1"
geojson = ">=3.0.1"
openpyxl = ">=3.1.2"
owslib = ">=0.29.1"
contextily = ">=1.3.0"
matplotlib = ">=3.10.8,<4"
tqdm = ">=4.67.1,<5"


[tool.pixi.feature.test.dependencies]
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
coverage = ">=7.13.0,<8"
teamcity-messages = ">=1.33,<2"
pytest-xdist = ">=3.8.0,<4"
pytest-profiling = ">=1.8.1,<2"

[tool.pixi.feature.dev.dependencies]
black = ">=22.8.0"
isort = ">=5.10.1"
commitizen = ">=3.0.1"
urllib3 = "==1.26.15"
jupyterlab = ">=4.5.0,<5"

[tool.pixi.feature.dev.tasks]
isort = "isort"
black = "black"
build = "python -m build --outdir dist/"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
py312 = ["py312", "default"]
py313 = ["py313", "default"]


[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
(
  /(
      \.git         # exclude a few common directories in the
    | \.github          # root of the project
    | \.env
    | \.venv
    | \.devcontainer
    | \.pixi
    | .pytest_cache
    | .scannerwork
    | .vscode
    | site
  )/
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip = [
  ".git",
  ".github",
  ".pixi",
  ".env",
  ".venv",
  ".devcontainer",
  ".pytest_cache",
  ".scannerwork",
  ".vscode",
  "site",
]
